# Change default prefix
unbind C-b
set -g prefix C-a

# Start window indexing from 1 instead of 0
set -g base-index 1

# The default value of the TERM environment variable inside tmux
set -g default-terminal "tmux-256color"

# The time tmux waits after receiving an Escape key to see if it is part of a longer key sequence
set -g escape-time 0

# The style of the status line as a whole
set -g status-style 'bg=#5026b2'

# Enable the mouse
# set -g mouse on

# Make scrolling with mouse wheel work in less
set-environment -g LESS '-R --mouse --wheel-lines=3'

